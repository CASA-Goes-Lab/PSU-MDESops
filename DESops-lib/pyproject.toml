[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "DESops"
version = "20.9.5"
description = "A library for modeling and analyzing Discrete Event Systems as finite state automata."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
authors = [
    { name = "Jack Weitze", email = "jweitze@umich.edu" },
    { name = "Romulo Meira Goes", email = "r.meiragoes@gmail.com" },
    { name = "Shoma Matsui", email = "smatsui@umich.edu" },
    { name = "Andrew Wintenberg", email = "awintenb@umich.edu" },
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "python-igraph>=0.9.10",
    "pydash>=4.7.6,<9",
    "requests>=2.24.0,<3.0.0",
    "dd>=0.5.6,<0.6.0",
    "tqdm>=4.46.1,<5.0.0",
    "numpy>=1.24,<3",
    "plotly>=5.0,<6.0",
    "scipy>=1.17.0,<2.0.0",
    "dash>=4.0.0,<5.0.0",
    "dash-cytoscape>=1.0.2,<2.0.0",
    "colorama>=0.4.3,<0.5.0; platform_system == 'Windows'",
]

[project.optional-dependencies]
caching = ["pycairo>=1.19.1,<2.0.0"]
docs = [
    "Sphinx>=5.0,<6.0",
    "sphinx-rtd-theme>=1.0.0,<2.0.0",
    "m2r2>=0.3.2,<0.4.0",
    "pyment>=0.3.3,<0.4.0",
]
dev = [
    "pytest>=8.0",
    "flake8>=3.7.9",
    "isort>=4.3.21",
    "seed-isort-config>=2.1.0",
    "pre-commit>=2.2.0",
    "rope>=0.17.0",
    "autoflake>=1.3.1",
]
# Formal verification of DESops/verified/ (needs Java; Nagini 1.3 requires Python >= 3.12).
verify = ["nagini>=1.3.1; python_version >= '3.12'"]
# Opacity enforcement via EdiSyn is not published to PyPI. Install it manually
# in editable mode alongside DESops, e.g.:
#   pip install -e ../EdiSyn

[tool.setuptools.packages.find]
include = ["DESops*"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
