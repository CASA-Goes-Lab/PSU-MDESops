# Built by maturin: it compiles the Rust (rust/) into the extension core_aut._rs and packs it
# with the Python packages. Building from source needs a Rust toolchain (rustup), not Verus.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "certisc"
version = "0.1.0"
description = "Certified supervisory control: discrete-event-system algorithms verified with Verus (Rust) and proved in Lean."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
authors = [
    { name = "Romulo Meira Goes", email = "r.meiragoes@gmail.com" },
]
requires-python = ">=3.11"
# No runtime dependencies: the verified core is compiled in (core_aut._rs).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.maturin]
python-source = "src"
manifest-path = "rust/binding/Cargo.toml"
# The extension goes into the core_aut package (src/core_aut/_rs.*.so).
module-name = "core_aut._rs"
# The other top-level packages; each new package goes here. Package files (py.typed) are
# included.
python-packages = ["ops_aut", "io_aut"]
# Not shipped: the Rust build output and Python byte-code caches.
exclude = ["rust/target/**", "**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
