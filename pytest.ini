# `pytest` from the repository root runs only the certisc tests.
# legacy/ (old DESops, archived Nagini code) is reference only: its packages are not installed
# in the certisc venv. Run the legacy suite from legacy/DESops-lib/ (its own pyproject config).
# Running from certisc-lib/ uses certisc-lib/pyproject.toml instead of this file.
[pytest]
testpaths = certisc-lib/tests
norecursedirs = legacy .venv target .lake
