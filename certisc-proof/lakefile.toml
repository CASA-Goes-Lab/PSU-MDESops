name = "DESopsProof"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["DESopsProof", "Tutorial"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Mathlib's copyright-header check, off for now. Whether files get a header (and whose) is undecided.
linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "DESopsProof"

# The Lean tutorial (Tutorial/README.md): built by `lake build` too, so it stays correct.
[[lean_lib]]
name = "Tutorial"
globs = ["Tutorial.+"]
# A misspelled name is an error, not a new variable (beginners' files). The two Mathlib linters
# that ask to merge consecutive `intro`s / `rw`s are off: the lessons take one step per line.
[lean_lib.leanOptions]
autoImplicit = false
weak.linter.tacticAnalysis.introMerge = false
weak.linter.tacticAnalysis.rwMerge = false
