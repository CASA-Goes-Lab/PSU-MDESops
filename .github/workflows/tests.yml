name: Tests

on:
  push:
    branches: [master, v2]
    paths: ["certisc-lib/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["certisc-lib/**", ".github/workflows/tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: certisc-lib
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: certisc-lib/pyproject.toml

      - name: Install certisc
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest
