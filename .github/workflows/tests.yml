name: Tests

on:
  push:
    branches: [master, v2]
    paths: ["DESops-lib/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["DESops-lib/**", ".github/workflows/tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DESops-lib
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: DESops-lib/pyproject.toml

      - name: Install DESops
        run: |
          python -m pip install --upgrade pip
          # The 'dd' dependency ships no wheel and its legacy setup.py needs
          # pkg_resources, which setuptools>=81 no longer bundles. Pre-install
          # a compatible setuptools and build without isolation so 'dd' picks
          # it up. See doc/scoping-report.md for details.
          pip install "setuptools<81" wheel
          pip install --no-build-isolation -e ".[dev]"

      - name: Run tests
        run: pytest
