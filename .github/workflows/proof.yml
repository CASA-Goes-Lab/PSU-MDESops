name: Proofs

on:
  push:
    branches: [master, v2]
    paths: ["certisc-proof/**", ".github/workflows/proof.yml"]
  pull_request:
    paths: ["certisc-proof/**", ".github/workflows/proof.yml"]

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs elan, fetches the Mathlib cache, and runs `lake build`.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: certisc-proof
